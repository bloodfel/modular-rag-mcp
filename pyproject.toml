[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "A modular RAG (Retrieval-Augmented Generation) MCP Server for knowledge management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["mcp", "rag", "retrieval", "llm", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.4.0",
    # Pinned below 2.0: the 2.x SDK removed the decorator API
    # (server.list_tools / server.call_tool) that protocol_handler.py uses,
    # which silently breaks the MCP server on a fresh install.
    "mcp>=1.0.0,<2",
    "jieba>=0.42",
    "markitdown[pdf]>=0.1.0",
    # PDF image extraction. Without it the loader degrades to text-only and
    # says so only in a log line, so image placeholders and captions quietly
    # vanish from the pipeline.
    "pymupdf>=1.24",
    "streamlit>=1.30.0",
    "ragas>=0.1.0",
    # ragas 0.4.3 imports ChatVertexAI/VertexAI from langchain_community at
    # module import; those modules were removed in langchain-community 0.4,
    # which makes `import ragas` fail outright. Nothing else pins it, so the
    # constraint lives here until ragas drops the import.
    "langchain-community<0.4",
    "datasets>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.14",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "openai>=1.0",
]
bench = [
    "sentence-transformers>=3.0",
    "ir-datasets>=0.5",
    "matplotlib>=3.8",
]
observability = [
    "langfuse>=3.0",
]

[project.scripts]
mcp-server = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "e2e: End-to-end tests (full system tests)",
    "llm: marks tests that require real LLM API calls (deselect with '-m \"not llm\"')",
    "slow: Slow tests that should be run less frequently",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
